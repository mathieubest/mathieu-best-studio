name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    # Donne au job la permission de déployer sur GitHub Pages
    permissions:
      contents: read
      pages: write
      id-token: write

    # Permet d'avoir un seul déploiement à la fois
    concurrency:
      group: pages
      cancel-in-progress: true

    # Obligatoire pour GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # Étape 1 : Récupérer le code source
      - name: Checkout
        uses: actions/checkout@v4

      # Étape 2 : Installer Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      # Étape 3 : Installer les dépendances
      - name: Install dependencies
        run: npm ci

      # Étape 4 : Builder le site → génère le dossier out/
      - name: Build
        run: npm run build

      # Étape 5 : Uploader le dossier out/ vers GitHub Pages
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

      # Étape 6 : Déployer sur GitHub Pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
